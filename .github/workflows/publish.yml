name: Publish to npm

# Publishes with npm trusted publishing (OIDC): no npm token is stored in this repo.
# The trusted publisher on npmjs.com allows `npm stage publish` only, so this
# workflow stages the release; a maintainer then approves it with 2FA on
# npmjs.com (or `npm stage approve <stage-id>`) before it becomes public.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm_publish
    permissions:
      contents: read
      id-token: write # lets the job request the OIDC token npm verifies

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - name: Update npm (npm stage needs a recent npm 11)
        run: npm install -g npm@11
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn test
      - name: Build
        run: yarn build
      - name: Stage publish
        run: npm stage publish --access public
